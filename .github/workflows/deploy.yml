name: Deploy to GitHub Pages

on:
  push:
    branches:
      - NonLocal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # This line is important for deployment
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
          
      - name: Install Dependencies
        working-directory: ./website/quantum_infection
        run: npm install
        
      - name: Build
        working-directory: ./website/quantum_infection
        env:
          CI: false
        run: npm run build
        
      - name: Debug Build Output
        run: |
          echo "Listing build directory contents:"
          ls -la ./python/build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./python/build    # Updated to match your build path
          force_orphan: true            # This ensures clean deployment

          # Credit Claude 3.5 Sonnet for helping me write this deploy file